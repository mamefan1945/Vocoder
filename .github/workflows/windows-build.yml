name: Windows build

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Identify vcpkg toolchain
        id: vcpkg-version
        shell: pwsh
        run: |
          $version = (& "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" version | Select-Object -First 1).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Using $version"

      - name: Prepare vcpkg binary cache directory
        id: vcpkg-cache
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> $env:GITHUB_ENV
          "path=$cache" >> $env:GITHUB_OUTPUT

      - name: Restore FluidSynth binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.vcpkg-cache.outputs.path }}
          # Bump the fluidsynth cache revision when intentionally upgrading it.
          key: vcpkg-${{ runner.os }}-x64-${{ steps.vcpkg-version.outputs.version }}-fluidsynth-r1

      - name: Install FluidSynth
        id: install-fluidsynth
        shell: pwsh
        run: '& "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install fluidsynth:x64-windows --classic'

      # Save immediately after dependency installation so a later DSP test
      # failure cannot prevent the dependency cache from being populated.
      - name: Save FluidSynth binary cache
        if: steps.install-fluidsynth.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.vcpkg-cache.outputs.path }}
          key: vcpkg-${{ runner.os }}-x64-${{ steps.vcpkg-version.outputs.version }}-fluidsynth-r1

      - name: Prepare JUCE FetchContent cache directory
        id: juce-cache
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'cmake-fetchcontent'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "FETCHCONTENT_BASE_DIR=$cache" >> $env:GITHUB_ENV
          "path=$cache" >> $env:GITHUB_OUTPUT

      - name: Restore JUCE source cache
        id: restore-juce
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.juce-cache.outputs.path }}
          # Bump this revision if the JUCE FetchContent declaration changes.
          key: cmake-${{ runner.os }}-juce-8.0.10-r1

      - name: Configure CMake
        id: configure-cmake
        shell: pwsh
        run: cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DFETCHCONTENT_BASE_DIR="$env:FETCHCONTENT_BASE_DIR"

      - name: Save JUCE source cache
        if: steps.configure-cmake.outcome == 'success' && steps.restore-juce.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.juce-cache.outputs.path }}
          key: cmake-${{ runner.os }}-juce-8.0.10-r1

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Run harmonizer DSP regression tests
        run: ctest --test-dir build -C Release --verbose --output-on-failure

      - name: Stage speech-test audio beside the executable
        shell: pwsh
        run: |
          if (Test-Path "TestAudio") {
            $exe = Get-ChildItem "build" -Filter "VoxTimbre.exe" -Recurse | Select-Object -First 1
            if (-not $exe) { throw "VoxTimbre.exe was not found after the build." }
            $target = Join-Path $exe.DirectoryName "TestAudio"
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            Copy-Item "TestAudio/*" -Destination $target -Recurse -Force
          }

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: VoxTimbre-Windows-x64-build-${{ github.run_number }}
          path: |
            build/**/VoxTimbre.exe
            build/**/VoxTimbre_artefacts/Release/SoundFonts/**
            build/**/TestAudio/**
            build/**/fluidsynth*.dll
            build/**/libfluidsynth*.dll
            build/**/FluidSynth-LGPL-2.1.txt
          if-no-files-found: error
          retention-days: 14
