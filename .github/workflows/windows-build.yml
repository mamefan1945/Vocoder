name: Windows build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install FluidSynth
        shell: pwsh
        run: '& "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install fluidsynth:x64-windows --classic'

      - name: Configure CMake
        shell: pwsh
        run: cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: Vocoder-Windows-x64
          path: |
            build/**/Vocoder.exe
            build/**/SoundFonts/**
            build/**/fluidsynth*.dll
            build/**/libfluidsynth*.dll
            build/**/FluidSynth-LGPL-2.1.txt
          if-no-files-found: error
          retention-days: 14
